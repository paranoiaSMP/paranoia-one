[package]
name = "paranoia-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
argon2 = "0.5.3"
base64 = "0.22.1"
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "cors", "limit", "set-header", "trace"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
